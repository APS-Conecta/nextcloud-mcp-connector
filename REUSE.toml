# work under the app's licence, not this repository's.
[[annotations]]
path = "src/mcp_connector/openapi/**"
precedence = "override"
SPDX-FileCopyrightText = "2026 Daniel Espinoza (APS-Conecta/estadistica)"
SPDX-License-Identifier = "AGPL-3.0-or-later"
