# are in THIRD-PARTY.md.
version = 1
SPDX-PackageName = "Nextcloud MCP Connector"
SPDX-PackageSupplier = "street1983nk <admin@infranode.dev>"
SPDX-PackageDownloadLocation = "https://github.com/street1983nk/nextcloud-mcp-connector"

[[annotations]]
path = "**"
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 street1983nk"
SPDX-License-Identifier = "AGPL-3.0-or-later"

